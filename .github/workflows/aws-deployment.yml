name: AWS Terraform Lab
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        default: plan
        options: [plan, apply, destroy]
permissions:
  contents: read
  id-token: write
concurrency:
  group: terraform-aws-state
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ inputs.operation == 'plan' || inputs.operation == 'apply' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform/AWS } }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform fmt -check -recursive
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_ami_id: ${{ vars.AWS_AMI_ID }}
          TF_VAR_key_name: ${{ vars.AWS_KEY_NAME }}
          TF_VAR_allowed_ssh_cidr: ${{ vars.AWS_ALLOWED_SSH_CIDR }}
      - uses: actions/upload-artifact@v4
        with: { name: aws-tfplan, path: terraform/AWS/tfplan, retention-days: 1 }
  apply:
    if: ${{ inputs.operation == 'apply' }}
    needs: plan
    runs-on: ubuntu-latest
    environment: aws-terraform-apply
    defaults: { run: { working-directory: terraform/AWS } }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform init
      - uses: actions/download-artifact@v4
        with: { name: aws-tfplan, path: terraform/AWS }
      - run: terraform apply -input=false tfplan
      - run: terraform output
  destroy:
    if: ${{ inputs.operation == 'destroy' }}
    runs-on: ubuntu-latest
    environment: aws-terraform-destroy
    defaults: { run: { working-directory: terraform/AWS } }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform init
      - run: terraform plan -destroy -out=tf-destroy-plan
      - run: terraform apply -input=false tf-destroy-plan
