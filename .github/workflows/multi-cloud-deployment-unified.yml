name: Unified Multi-Cloud Terraform Deployment
run-name: "Multi-cloud ${{ inputs.operation }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Run Plan, Plan plus approved Apply, or approved Destroy across Azure, AWS and GCP."
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  # Phase 1: Run the selected Terraform plan independently in all three clouds.
  # fail-fast=false lets the other cloud plans finish and report their own results.
  plan:
    name: "Plan - ${{ matrix.cloud }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - cloud: azure
            tf_directory: terraform/Azure
          - cloud: aws
            tf_directory: terraform/AWS
          - cloud: gcp
            tf_directory: terraform/GCP
    concurrency:
      group: terraform-${{ matrix.cloud }}-state
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify deployment branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch so the existing provider OIDC trust rules match."
            exit 1
          fi

      # Configure only the credentials and Terraform inputs for this matrix child.
      - name: Configure Azure Terraform environment
        if: ${{ matrix.cloud == 'azure' }}
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_SAS_TOKEN: ${{ secrets.AZURE_TFSTATE_SAS_TOKEN }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          TF_VAR_vm_name: ${{ vars.AZURE_VM_NAME }}
          TF_VAR_vm_size: ${{ vars.AZURE_VM_SIZE }}
          TF_VAR_admin_username: ${{ vars.AZURE_ADMIN_USERNAME }}
          TF_VAR_admin_ssh_public_key: ${{ secrets.AZURE_SSH_PUBLIC_KEY }}
          TF_VAR_vnet_name: ${{ vars.AZURE_VNET_NAME }}
          TF_VAR_vnet_cidr: ${{ vars.AZURE_VNET_CIDR }}
          TF_VAR_subnet_name: ${{ vars.AZURE_SUBNET_NAME }}
          TF_VAR_subnet_cidr: ${{ vars.AZURE_SUBNET_CIDR }}
          TF_VAR_nsg_name: ${{ vars.AZURE_NSG_NAME }}
          TF_VAR_nic_name: ${{ vars.AZURE_NIC_NAME }}
          TF_VAR_load_balancer_name: ${{ vars.AZURE_LB_NAME }}
          TF_VAR_load_balancer_public_ip_name: ${{ vars.AZURE_LB_PUBLIC_IP_NAME }}
        run: |
          required=(ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID ARM_SAS_TOKEN
            TF_VAR_location TF_VAR_resource_group_name TF_VAR_vm_name TF_VAR_vm_size
            TF_VAR_admin_username TF_VAR_admin_ssh_public_key TF_VAR_vnet_name TF_VAR_vnet_cidr
            TF_VAR_subnet_name TF_VAR_subnet_cidr TF_VAR_nsg_name TF_VAR_nic_name
            TF_VAR_load_balancer_name TF_VAR_load_balancer_public_ip_name)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing Azure configuration::$name is empty. Check GitHub Variables/Secrets."
              exit 1
            fi
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          printf '%s=%s\n' ARM_USE_OIDC "$ARM_USE_OIDC" >> "$GITHUB_ENV"

      - name: Azure login using GitHub OIDC
        if: ${{ matrix.cloud == 'azure' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure subscription identity
        if: ${{ matrix.cloud == 'azure' }}
        run: az account show --query "{subscription:id, tenant:tenantId, user:user.name}" --output json

      - name: Configure AWS Terraform environment
        if: ${{ matrix.cloud == 'aws' }}
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_project_name: ${{ vars.AWS_PROJECT_NAME }}
          TF_VAR_vpc_cidr: ${{ vars.AWS_VPC_CIDR }}
          TF_VAR_public_subnet_1_cidr: ${{ vars.AWS_PUBLIC_SUBNET_1_CIDR }}
          TF_VAR_public_subnet_2_cidr: ${{ vars.AWS_PUBLIC_SUBNET_2_CIDR }}
          TF_VAR_instance_type: ${{ vars.AWS_INSTANCE_TYPE }}
          TF_VAR_instance_name: ${{ vars.AWS_INSTANCE_NAME }}
          TF_VAR_alb_name: ${{ vars.AWS_ALB_NAME }}
          TF_VAR_target_group_name: ${{ vars.AWS_TARGET_GROUP_NAME }}
          TF_VAR_allowed_http_cidr: ${{ vars.AWS_ALLOWED_HTTP_CIDR }}
        run: |
          required=(AWS_REGION AWS_ROLE_TO_ASSUME TF_VAR_region TF_VAR_project_name TF_VAR_vpc_cidr TF_VAR_public_subnet_1_cidr
            TF_VAR_public_subnet_2_cidr TF_VAR_instance_type TF_VAR_instance_name
            TF_VAR_alb_name TF_VAR_target_group_name TF_VAR_allowed_http_cidr)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing AWS configuration::$name is empty. Check GitHub Variables."
              exit 1
            fi
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          printf '%s=%s\n' AWS_DEFAULT_REGION "$AWS_DEFAULT_REGION" >> "$GITHUB_ENV"

      - name: Configure AWS credentials using GitHub OIDC
        if: ${{ matrix.cloud == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: gha-unified-multi-cloud-terraform
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        if: ${{ matrix.cloud == 'aws' }}
        run: aws sts get-caller-identity

      - name: Configure GCP Terraform environment
        if: ${{ matrix.cloud == 'gcp' }}
        shell: bash
        env:
          CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_zone: ${{ vars.GCP_ZONE }}
          TF_VAR_vm_name: ${{ vars.GCP_VM_NAME }}
          TF_VAR_machine_type: ${{ vars.GCP_MACHINE_TYPE }}
          TF_VAR_vpc_name: ${{ vars.GCP_VPC_NAME }}
          TF_VAR_subnet_name: ${{ vars.GCP_SUBNET_NAME }}
          TF_VAR_subnet_cidr: ${{ vars.GCP_SUBNET_CIDR }}
          TF_VAR_firewall_name: ${{ vars.GCP_FIREWALL_NAME }}
          TF_VAR_load_balancer_name: ${{ vars.GCP_LB_NAME }}
        run: |
          required=(CLOUDSDK_CORE_PROJECT GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_TERRAFORM_SERVICE_ACCOUNT TF_VAR_project_id TF_VAR_region TF_VAR_zone
            TF_VAR_vm_name TF_VAR_machine_type TF_VAR_vpc_name TF_VAR_subnet_name
            TF_VAR_subnet_cidr TF_VAR_firewall_name TF_VAR_load_balancer_name)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing GCP configuration::$name is empty. Check GitHub Variables."
              exit 1
            fi
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - name: Authenticate to Google Cloud using Workload Identity Federation
        if: ${{ matrix.cloud == 'gcp' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        if: ${{ matrix.cloud == 'gcp' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify Google Cloud identity and project
        if: ${{ matrix.cloud == 'gcp' }}
        run: |
          gcloud config get-value project
          gcloud auth list --filter=status:ACTIVE --format="value(account)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.tf_directory }}

      - name: Terraform init
        run: terraform init -input=false -reconfigure
        working-directory: ${{ matrix.tf_directory }}

      - name: Terraform validate
        run: terraform validate
        working-directory: ${{ matrix.tf_directory }}

      - name: Create normal plan
        if: ${{ inputs.operation != 'destroy' }}
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
        working-directory: ${{ matrix.tf_directory }}

      - name: Create destroy plan
        if: ${{ inputs.operation == 'destroy' }}
        run: terraform plan -destroy -input=false -lock-timeout=5m -out=tfplan
        working-directory: ${{ matrix.tf_directory }}

      - name: Display exact saved plan for review
        run: terraform show -no-color tfplan
        working-directory: ${{ matrix.tf_directory }}

      - name: Upload provider plan for the protected execution phase
        if: ${{ inputs.operation == 'apply' || inputs.operation == 'destroy' }}
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ matrix.cloud }}-${{ inputs.operation }}
          path: ${{ matrix.tf_directory }}/tfplan
          if-no-files-found: error
          retention-days: 1

  # Phase 2: Execute only after all three plans succeed. The protected environment
  # is attached to each actual provider deployment job, preserving the existing
  # Azure/AWS environment-specific OIDC subjects for Apply and Destroy.
  # Phase 2 (continued): Each cloud execution remains independently protected.
  # Matrix legs can run in parallel, but each waits for the configured Environment approval.
  execute:
    name: "${{ inputs.operation }} - ${{ matrix.cloud }}"
    if: ${{ inputs.operation == 'apply' || inputs.operation == 'destroy' }}
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.operation == 'destroy' && 'terraform-destroy' || 'terraform-apply' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - cloud: azure
            tf_directory: terraform/Azure
          - cloud: aws
            tf_directory: terraform/AWS
          - cloud: gcp
            tf_directory: terraform/GCP
    concurrency:
      group: terraform-${{ matrix.cloud }}-state
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Azure Terraform environment
        if: ${{ matrix.cloud == 'azure' }}
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_SAS_TOKEN: ${{ secrets.AZURE_TFSTATE_SAS_TOKEN }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          TF_VAR_vm_name: ${{ vars.AZURE_VM_NAME }}
          TF_VAR_vm_size: ${{ vars.AZURE_VM_SIZE }}
          TF_VAR_admin_username: ${{ vars.AZURE_ADMIN_USERNAME }}
          TF_VAR_admin_ssh_public_key: ${{ secrets.AZURE_SSH_PUBLIC_KEY }}
          TF_VAR_vnet_name: ${{ vars.AZURE_VNET_NAME }}
          TF_VAR_vnet_cidr: ${{ vars.AZURE_VNET_CIDR }}
          TF_VAR_subnet_name: ${{ vars.AZURE_SUBNET_NAME }}
          TF_VAR_subnet_cidr: ${{ vars.AZURE_SUBNET_CIDR }}
          TF_VAR_nsg_name: ${{ vars.AZURE_NSG_NAME }}
          TF_VAR_nic_name: ${{ vars.AZURE_NIC_NAME }}
          TF_VAR_load_balancer_name: ${{ vars.AZURE_LB_NAME }}
          TF_VAR_load_balancer_public_ip_name: ${{ vars.AZURE_LB_PUBLIC_IP_NAME }}
        run: |
          required=(ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID ARM_SAS_TOKEN
            TF_VAR_location TF_VAR_resource_group_name TF_VAR_vm_name TF_VAR_vm_size
            TF_VAR_admin_username TF_VAR_admin_ssh_public_key TF_VAR_vnet_name TF_VAR_vnet_cidr
            TF_VAR_subnet_name TF_VAR_subnet_cidr TF_VAR_nsg_name TF_VAR_nic_name
            TF_VAR_load_balancer_name TF_VAR_load_balancer_public_ip_name)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing Azure configuration::$name is empty. Check GitHub Variables/Secrets."
              exit 1
            fi
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          printf '%s=%s\n' ARM_USE_OIDC "$ARM_USE_OIDC" >> "$GITHUB_ENV"

      - name: Azure login using GitHub OIDC
        if: ${{ matrix.cloud == 'azure' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure subscription identity
        if: ${{ matrix.cloud == 'azure' }}
        run: az account show --query "{subscription:id, tenant:tenantId, user:user.name}" --output json

      - name: Configure AWS Terraform environment
        if: ${{ matrix.cloud == 'aws' }}
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_project_name: ${{ vars.AWS_PROJECT_NAME }}
          TF_VAR_vpc_cidr: ${{ vars.AWS_VPC_CIDR }}
          TF_VAR_public_subnet_1_cidr: ${{ vars.AWS_PUBLIC_SUBNET_1_CIDR }}
          TF_VAR_public_subnet_2_cidr: ${{ vars.AWS_PUBLIC_SUBNET_2_CIDR }}
          TF_VAR_instance_type: ${{ vars.AWS_INSTANCE_TYPE }}
          TF_VAR_instance_name: ${{ vars.AWS_INSTANCE_NAME }}
          TF_VAR_alb_name: ${{ vars.AWS_ALB_NAME }}
          TF_VAR_target_group_name: ${{ vars.AWS_TARGET_GROUP_NAME }}
          TF_VAR_allowed_http_cidr: ${{ vars.AWS_ALLOWED_HTTP_CIDR }}
        run: |
          required=(AWS_REGION AWS_ROLE_TO_ASSUME TF_VAR_project_name TF_VAR_vpc_cidr TF_VAR_public_subnet_1_cidr
            TF_VAR_public_subnet_2_cidr TF_VAR_instance_type TF_VAR_instance_name
            TF_VAR_alb_name TF_VAR_target_group_name TF_VAR_allowed_http_cidr)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing AWS configuration::$name is empty. Check GitHub Variables."
              exit 1
            fi
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          printf '%s=%s\n' AWS_DEFAULT_REGION "$AWS_DEFAULT_REGION" >> "$GITHUB_ENV"

      - name: Configure AWS credentials using GitHub OIDC
        if: ${{ matrix.cloud == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: gha-unified-multi-cloud-terraform
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        if: ${{ matrix.cloud == 'aws' }}
        run: aws sts get-caller-identity

      - name: Configure GCP Terraform environment
        if: ${{ matrix.cloud == 'gcp' }}
        shell: bash
        env:
          CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_zone: ${{ vars.GCP_ZONE }}
          TF_VAR_vm_name: ${{ vars.GCP_VM_NAME }}
          TF_VAR_machine_type: ${{ vars.GCP_MACHINE_TYPE }}
          TF_VAR_vpc_name: ${{ vars.GCP_VPC_NAME }}
          TF_VAR_subnet_name: ${{ vars.GCP_SUBNET_NAME }}
          TF_VAR_subnet_cidr: ${{ vars.GCP_SUBNET_CIDR }}
          TF_VAR_firewall_name: ${{ vars.GCP_FIREWALL_NAME }}
          TF_VAR_load_balancer_name: ${{ vars.GCP_LB_NAME }}
        run: |
          required=(CLOUDSDK_CORE_PROJECT GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_TERRAFORM_SERVICE_ACCOUNT TF_VAR_project_id TF_VAR_region TF_VAR_zone
            TF_VAR_vm_name TF_VAR_machine_type TF_VAR_vpc_name TF_VAR_subnet_name
            TF_VAR_subnet_cidr TF_VAR_firewall_name TF_VAR_load_balancer_name)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing GCP configuration::$name is empty. Check GitHub Variables."
              exit 1
            fi
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - name: Authenticate to Google Cloud using Workload Identity Federation
        if: ${{ matrix.cloud == 'gcp' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        if: ${{ matrix.cloud == 'gcp' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify Google Cloud identity and project
        if: ${{ matrix.cloud == 'gcp' }}
        run: |
          gcloud config get-value project
          gcloud auth list --filter=status:ACTIVE --format="value(account)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -reconfigure
        working-directory: ${{ matrix.tf_directory }}

      - name: Download this provider's reviewed plan
        uses: actions/download-artifact@v8
        with:
          name: terraform-plan-${{ matrix.cloud }}-${{ inputs.operation }}
          path: ${{ matrix.tf_directory }}

      - name: Apply the reviewed saved plan
        run: terraform apply -input=false -lock-timeout=5m tfplan
        working-directory: ${{ matrix.tf_directory }}

      - name: Show Terraform outputs
        if: ${{ inputs.operation == 'apply' }}
        run: terraform output
        working-directory: ${{ matrix.tf_directory }}
