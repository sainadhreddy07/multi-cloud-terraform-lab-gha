name: Unified Multi-Cloud Terraform Deployment
run-name: "Multi-cloud ${{ inputs.cloud }} / ${{ inputs.operation }}"

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud to operate on
        type: choice
        required: true
        default: all
        options: [all, azure, aws, gcp]
      operation:
        description: Terraform operation
        type: choice
        required: true
        default: plan
        options: [plan, apply, destroy]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: "Plan - ${{ matrix.cloud }}"
    runs-on: ubuntu-latest
    environment:
      name: ${{ matrix.cloud == 'azure' && (inputs.operation == 'destroy' && 'terraform-destroy' || 'terraform-apply') || matrix.cloud == 'aws' && (inputs.operation == 'destroy' && 'aws-terraform-destroy' || 'aws-terraform-apply') || (inputs.operation == 'destroy' && 'gcp-terraform-destroy' || 'gcp-terraform-apply') }}
    strategy:
      fail-fast: false
      matrix:
        cloud: ${{ fromJSON(inputs.cloud == 'all' && '[\"azure\",\"aws\",\"gcp\"]' || format('[\"{0}\"]', inputs.cloud)) }}
    concurrency:
      group: terraform-${{ matrix.cloud }}-state
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ matrix.cloud == 'azure' && 'terraform/Azure' || matrix.cloud == 'aws' && 'terraform/AWS' || 'terraform/GCP' }}
    steps:
      - uses: actions/checkout@v4

      # Cloud credentials + variables (same inputs are repeated in execute job).
      - name: Azure configuration
        if: matrix.cloud == 'azure'
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_SAS_TOKEN: ${{ secrets.AZURE_TFSTATE_SAS_TOKEN }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          TF_VAR_vm_name: ${{ vars.AZURE_VM_NAME }}
          TF_VAR_vm_size: ${{ vars.AZURE_VM_SIZE }}
          TF_VAR_admin_username: ${{ vars.AZURE_ADMIN_USERNAME }}
          TF_VAR_admin_ssh_public_key: ${{ secrets.AZURE_SSH_PUBLIC_KEY }}
          TF_VAR_vnet_name: ${{ vars.AZURE_VNET_NAME }}
          TF_VAR_vnet_cidr: ${{ vars.AZURE_VNET_CIDR }}
          TF_VAR_subnet_name: ${{ vars.AZURE_SUBNET_NAME }}
          TF_VAR_subnet_cidr: ${{ vars.AZURE_SUBNET_CIDR }}
          TF_VAR_nsg_name: ${{ vars.AZURE_NSG_NAME }}
          TF_VAR_nic_name: ${{ vars.AZURE_NIC_NAME }}
          TF_VAR_load_balancer_name: ${{ vars.AZURE_LB_NAME }}
          TF_VAR_load_balancer_public_ip_name: ${{ vars.AZURE_LB_PUBLIC_IP_NAME }}
        run: |
          set -euo pipefail
          for n in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID ARM_SAS_TOKEN TF_VAR_location TF_VAR_resource_group_name TF_VAR_vm_name TF_VAR_vm_size TF_VAR_admin_username TF_VAR_admin_ssh_public_key TF_VAR_vnet_name TF_VAR_vnet_cidr TF_VAR_subnet_name TF_VAR_subnet_cidr TF_VAR_nsg_name TF_VAR_nic_name TF_VAR_load_balancer_name TF_VAR_load_balancer_public_ip_name; do
            [[ -n "${!n:-}" ]] || { echo "::error::$n is empty"; exit 1; }
          done
      - uses: azure/login@v2
        if: matrix.cloud == 'azure'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Azure identity
        if: matrix.cloud == 'azure'
        run: az account show

      - name: AWS configuration
        if: matrix.cloud == 'aws'
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_name: ${{ vars.AWS_PROJECT_NAME }}
          TF_VAR_vpc_cidr: ${{ vars.AWS_VPC_CIDR }}
          TF_VAR_public_subnet_cidrs: '["${{ vars.AWS_PUBLIC_SUBNET_1_CIDR }}","${{ vars.AWS_PUBLIC_SUBNET_2_CIDR }}"]'
          TF_VAR_instance_type: ${{ vars.AWS_INSTANCE_TYPE }}
          TF_VAR_key_name: ${{ vars.AWS_KEY_NAME }}
          TF_VAR_allowed_ssh_cidr: ${{ vars.AWS_ALLOWED_SSH_CIDR }}
        run: |
          set -euo pipefail
          for n in AWS_REGION TF_VAR_aws_region TF_VAR_name TF_VAR_vpc_cidr TF_VAR_public_subnet_cidrs TF_VAR_instance_type; do
            [[ -n "${!n:-}" ]] || { echo "::error::$n is empty"; exit 1; }
          done
      - uses: aws-actions/configure-aws-credentials@v4
        if: matrix.cloud == 'aws'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: gha-multicloud-terraform
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify AWS identity
        if: matrix.cloud == 'aws'
        run: aws sts get-caller-identity

      - name: GCP configuration
        if: matrix.cloud == 'gcp'
        shell: bash
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_zone: ${{ vars.GCP_ZONE }}
          TF_VAR_name: ${{ vars.GCP_VM_NAME }}
          TF_VAR_network_cidr: ${{ vars.GCP_NETWORK_CIDR }}
          TF_VAR_subnet_cidr: ${{ vars.GCP_SUBNET_CIDR }}
          TF_VAR_machine_type: ${{ vars.GCP_MACHINE_TYPE }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for n in TF_VAR_project_id TF_VAR_region TF_VAR_zone TF_VAR_name TF_VAR_network_cidr TF_VAR_subnet_cidr TF_VAR_machine_type GCP_WORKLOAD_IDENTITY_PROVIDER GCP_TERRAFORM_SERVICE_ACCOUNT; do
            [[ -n "${!n:-}" ]] || { echo "::error::$n is empty"; exit 1; }
          done
      - uses: google-github-actions/auth@v2
        if: matrix.cloud == 'gcp'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v2
        if: matrix.cloud == 'gcp'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Verify GCP identity
        if: matrix.cloud == 'gcp'
        run: |
          gcloud config get-value project
          gcloud auth list --filter=status:ACTIVE --format="value(account)"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform init -input=false -reconfigure
      - run: terraform validate
      - name: Create plan
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == "destroy" ]]; then
            terraform plan -destroy -input=false -lock-timeout=5m -out=tfplan
          else
            terraform plan -input=false -lock-timeout=5m -out=tfplan
          fi
      - run: terraform show -no-color tfplan
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.operation != 'plan' }}
        with:
          name: tfplan-${{ matrix.cloud }}-${{ inputs.operation }}
          path: ${{ matrix.cloud == 'azure' && 'terraform/Azure/tfplan' || matrix.cloud == 'aws' && 'terraform/AWS/tfplan' || 'terraform/GCP/tfplan' }}
          if-no-files-found: error
          retention-days: 1

  execute:
    if: inputs.operation != 'plan'
    name: "${{ inputs.operation }} - ${{ matrix.cloud }}"
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: ${{ fromJSON(inputs.cloud == 'all' && '[\"azure\",\"aws\",\"gcp\"]' || format('[\"{0}\"]', inputs.cloud)) }}
    environment:
      name: ${{ matrix.cloud == 'azure' && (inputs.operation == 'destroy' && 'terraform-destroy' || 'terraform-apply') || matrix.cloud == 'aws' && (inputs.operation == 'destroy' && 'aws-terraform-destroy' || 'aws-terraform-apply') || (inputs.operation == 'destroy' && 'gcp-terraform-destroy' || 'gcp-terraform-apply') }}
    concurrency:
      group: terraform-${{ matrix.cloud }}-state
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ matrix.cloud == 'azure' && 'terraform/Azure' || matrix.cloud == 'aws' && 'terraform/AWS' || 'terraform/GCP' }}
    steps:
      - uses: actions/checkout@v4
      # Re-establish provider credentials and all Terraform inputs on this separate runner.
      - name: Azure configuration
        if: matrix.cloud == 'azure'
        shell: bash
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          ARM_SAS_TOKEN: ${{ secrets.AZURE_TFSTATE_SAS_TOKEN }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION }}
          TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          TF_VAR_vm_name: ${{ vars.AZURE_VM_NAME }}
          TF_VAR_vm_size: ${{ vars.AZURE_VM_SIZE }}
          TF_VAR_admin_username: ${{ vars.AZURE_ADMIN_USERNAME }}
          TF_VAR_admin_ssh_public_key: ${{ secrets.AZURE_SSH_PUBLIC_KEY }}
          TF_VAR_vnet_name: ${{ vars.AZURE_VNET_NAME }}
          TF_VAR_vnet_cidr: ${{ vars.AZURE_VNET_CIDR }}
          TF_VAR_subnet_name: ${{ vars.AZURE_SUBNET_NAME }}
          TF_VAR_subnet_cidr: ${{ vars.AZURE_SUBNET_CIDR }}
          TF_VAR_nsg_name: ${{ vars.AZURE_NSG_NAME }}
          TF_VAR_nic_name: ${{ vars.AZURE_NIC_NAME }}
          TF_VAR_load_balancer_name: ${{ vars.AZURE_LB_NAME }}
          TF_VAR_load_balancer_public_ip_name: ${{ vars.AZURE_LB_PUBLIC_IP_NAME }}
        run: |
          set -euo pipefail
          for n in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID ARM_SAS_TOKEN TF_VAR_location TF_VAR_resource_group_name TF_VAR_vm_name TF_VAR_vm_size TF_VAR_admin_username TF_VAR_admin_ssh_public_key TF_VAR_vnet_name TF_VAR_vnet_cidr TF_VAR_subnet_name TF_VAR_subnet_cidr TF_VAR_nsg_name TF_VAR_nic_name TF_VAR_load_balancer_name TF_VAR_load_balancer_public_ip_name; do
            [[ -n "${!n:-}" ]] || { echo "::error::$n is empty"; exit 1; }
          done
      - uses: azure/login@v2
        if: matrix.cloud == 'azure'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: AWS configuration
        if: matrix.cloud == 'aws'
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_name: ${{ vars.AWS_PROJECT_NAME }}
          TF_VAR_vpc_cidr: ${{ vars.AWS_VPC_CIDR }}
          TF_VAR_public_subnet_cidrs: '["${{ vars.AWS_PUBLIC_SUBNET_1_CIDR }}","${{ vars.AWS_PUBLIC_SUBNET_2_CIDR }}"]'
          TF_VAR_instance_type: ${{ vars.AWS_INSTANCE_TYPE }}
          TF_VAR_key_name: ${{ vars.AWS_KEY_NAME }}
          TF_VAR_allowed_ssh_cidr: ${{ vars.AWS_ALLOWED_SSH_CIDR }}
        run: |
          set -euo pipefail
          for n in AWS_REGION TF_VAR_aws_region TF_VAR_name TF_VAR_vpc_cidr TF_VAR_public_subnet_cidrs TF_VAR_instance_type; do
            [[ -n "${!n:-}" ]] || { echo "::error::$n is empty"; exit 1; }
          done
      - uses: aws-actions/configure-aws-credentials@v4
        if: matrix.cloud == 'aws'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: gha-multicloud-terraform
          aws-region: ${{ vars.AWS_REGION }}
      - name: GCP configuration
        if: matrix.cloud == 'gcp'
        shell: bash
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_zone: ${{ vars.GCP_ZONE }}
          TF_VAR_name: ${{ vars.GCP_VM_NAME }}
          TF_VAR_network_cidr: ${{ vars.GCP_NETWORK_CIDR }}
          TF_VAR_subnet_cidr: ${{ vars.GCP_SUBNET_CIDR }}
          TF_VAR_machine_type: ${{ vars.GCP_MACHINE_TYPE }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for n in TF_VAR_project_id TF_VAR_region TF_VAR_zone TF_VAR_name TF_VAR_network_cidr TF_VAR_subnet_cidr TF_VAR_machine_type GCP_WORKLOAD_IDENTITY_PROVIDER GCP_TERRAFORM_SERVICE_ACCOUNT; do
            [[ -n "${!n:-}" ]] || { echo "::error::$n is empty"; exit 1; }
          done
      - uses: google-github-actions/auth@v2
        if: matrix.cloud == 'gcp'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v2
        if: matrix.cloud == 'gcp'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform init -input=false -reconfigure
      - uses: actions/download-artifact@v4
        if: ${{ inputs.operation == 'apply' || inputs.operation == 'destroy' }}
        with:
          name: tfplan-${{ matrix.cloud }}-${{ inputs.operation }}
          path: ${{ matrix.cloud == 'azure' && 'terraform/Azure' || matrix.cloud == 'aws' && 'terraform/AWS' || 'terraform/GCP' }}
      - name: Execute reviewed plan
        run: terraform apply -input=false -lock-timeout=5m tfplan
      - name: Terraform outputs (Apply only)
        if: inputs.operation == 'apply'
        run: terraform output
      - name: Verify empty state (Destroy only)
        if: inputs.operation == 'destroy'
        run: |
          remaining="$(terraform state list)"
          if [[ -n "$remaining" ]]; then
            echo "::error::Terraform state still contains resources after destroy:"
            echo "$remaining"
            exit 1
          fi
